name: kneeguard
description: KneeGuard 膝关节运动监测应用

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"


dependencies:
  flutter:
    sdk: flutter

  # 蓝牙连接
  flutter_blue_plus: ^1.35.5
  # 文字转语音
  flutter_tts: ^3.8.3
  
  # 权限管理
  permission_handler: ^11.0.1
  
  # JSON处理
  json_annotation: ^4.9.0
 
  # 本地存储
  shared_preferences: ^2.2.0
  
  # 文件操作
  path_provider: ^2.1.0
  
  # CSV导出
  csv: ^5.0.2
  
  # 日期时间处理
  intl: ^0.18.1
  
  # 状态管理
  provider: ^6.0.5
  
  # HTTP请求（云同步功能）
  http: ^1.1.0
  
  # 设备信息
  device_info_plus: ^9.1.0
  
  # 振动反馈
#  flutter_vibrate: ^1.3.0

  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
    
  # 代码生成
  json_serializable: ^6.7.1
  build_runner: ^2.4.6

  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  # 添加应用图标和启动画面
  assets:
    - assets/images/
#    - assets/icons/

  # 字体配置
#  fonts:
